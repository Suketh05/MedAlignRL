name: sanity-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all source files
        run: |
          cd src
          for f in *.py; do python -m py_compile "$f"; done
      - name: Validate notebooks are well-formed JSON
        run: |
          for f in notebooks/*.ipynb; do python -c "import json; json.load(open('$f'))"; done
